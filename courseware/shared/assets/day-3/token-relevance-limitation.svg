<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative token-relevance map with omitted computation paths</title>
  <desc id="desc">The focus token it has illustrative relevance links to ball, rolling, and chased. A second diagram adds values, other heads and layers, residual paths, and later transformations to show why attention weights are not a complete causal explanation.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#1F6074"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#B33A3A"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#F7F5EF"/>
  <text x="55" y="58" font-family="Aptos, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#18333D">Attention is one relevance path in a larger computation</text>
  <rect x="945" y="28" width="280" height="42" rx="7" fill="#FFF4D9" stroke="#B27A19" stroke-width="2"/>
  <text x="1085" y="55" font-family="Aptos, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#7B5311">ILLUSTRATIVE - NOT MODEL OUTPUT</text>

  <g font-family="Aptos, Helvetica, sans-serif">
    <text x="55" y="115" font-size="20" fill="#455B62">The dog chased the ball because it was rolling.</text>
    <text x="55" y="153" font-size="19" font-weight="700" fill="#18333D">Focus token: it</text>
    <g transform="translate(55 190)" font-size="18" text-anchor="middle">
      <g><rect width="105" height="55" rx="7" fill="#FFFFFF" stroke="#557B83" stroke-width="2"/><text x="52" y="35" fill="#18333D">The</text></g>
      <g transform="translate(120)"><rect width="105" height="55" rx="7" fill="#FFFFFF" stroke="#557B83" stroke-width="2"/><text x="52" y="35" fill="#18333D">dog</text></g>
      <g transform="translate(240)"><rect width="105" height="55" rx="7" fill="#FFFFFF" stroke="#557B83" stroke-width="2"/><text x="52" y="35" fill="#18333D">chased</text></g>
      <g transform="translate(360)"><rect width="105" height="55" rx="7" fill="#FFFFFF" stroke="#557B83" stroke-width="2"/><text x="52" y="35" fill="#18333D">the</text></g>
      <g transform="translate(480)"><rect width="105" height="55" rx="7" fill="#C8DED9" stroke="#157A6E" stroke-width="3"/><text x="52" y="35" fill="#18333D">ball</text></g>
      <g transform="translate(600)"><rect width="105" height="55" rx="7" fill="#FFFFFF" stroke="#557B83" stroke-width="2"/><text x="52" y="35" fill="#18333D">because</text></g>
      <g transform="translate(720)"><rect width="105" height="55" rx="7" fill="#F2D0CC" stroke="#B33A3A" stroke-width="3"/><text x="52" y="35" font-weight="700" fill="#18333D">it</text></g>
      <g transform="translate(840)"><rect width="105" height="55" rx="7" fill="#FFFFFF" stroke="#557B83" stroke-width="2"/><text x="52" y="35" fill="#18333D">was</text></g>
      <g transform="translate(960)"><rect width="105" height="55" rx="7" fill="#D9EBDD" stroke="#28704B" stroke-width="3"/><text x="52" y="35" fill="#18333D">rolling</text></g>
    </g>

    <path d="M827 245 C820 315 670 325 587 245" fill="none" stroke="#157A6E" stroke-width="10" opacity="0.9" marker-end="url(#arrowBlue)"/>
    <path d="M827 245 C850 300 975 300 1067 245" fill="none" stroke="#28704B" stroke-width="6" opacity="0.9" marker-end="url(#arrowBlue)"/>
    <path d="M827 245 C770 360 480 360 347 245" fill="none" stroke="#D08A26" stroke-width="3" opacity="0.9" marker-end="url(#arrowBlue)"/>
    <text x="680" y="318" font-size="17" font-weight="700" fill="#157A6E">largest illustrative link</text>
    <text x="935" y="292" font-size="16" fill="#28704B">event/property</text>
    <text x="515" y="370" font-size="16" fill="#A86B14">weaker event link</text>

    <g transform="translate(55 425)">
      <rect width="530" height="220" rx="8" fill="#E8F1EF" stroke="#157A6E" stroke-width="3"/>
      <text x="22" y="38" font-size="21" font-weight="700" fill="#157A6E">WHAT THE MAP CAN SHOW</text>
      <text x="22" y="78" font-size="18" fill="#18333D">One attention operation assigned different</text>
      <text x="22" y="105" font-size="18" fill="#18333D">mixture weights to available representations.</text>
      <text x="22" y="145" font-size="18" fill="#18333D">Q: what the focus seeks</text>
      <text x="22" y="172" font-size="18" fill="#18333D">K: how context can be matched</text>
      <text x="22" y="199" font-size="18" fill="#18333D">V: content carried into the mixture</text>
    </g>

    <g transform="translate(620 405)">
      <rect width="605" height="260" rx="8" fill="#FBE4E1" stroke="#B33A3A" stroke-width="3"/>
      <text x="22" y="40" font-size="21" font-weight="700" fill="#972F2F">WHY THIS IS NOT A COMPLETE CAUSAL EXPLANATION</text>
      <g font-size="17" fill="#18333D">
        <rect x="25" y="68" width="130" height="46" rx="6" fill="#FFFFFF" stroke="#B33A3A"/><text x="90" y="97" text-anchor="middle">value content</text>
        <rect x="175" y="68" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#B33A3A"/><text x="250" y="97" text-anchor="middle">other heads/layers</text>
        <rect x="345" y="68" width="120" height="46" rx="6" fill="#FFFFFF" stroke="#B33A3A"/><text x="405" y="97" text-anchor="middle">residual path</text>
        <rect x="485" y="68" width="95" height="46" rx="6" fill="#FFFFFF" stroke="#B33A3A"/><text x="532" y="97" text-anchor="middle">output head</text>
      </g>
      <path d="M90 115 C90 150 180 150 250 165" fill="none" stroke="#B33A3A" stroke-width="3" marker-end="url(#arrowRed)"/>
      <path d="M250 115 V165" fill="none" stroke="#B33A3A" stroke-width="3" marker-end="url(#arrowRed)"/>
      <path d="M405 115 C405 150 320 150 250 165" fill="none" stroke="#B33A3A" stroke-width="3" marker-end="url(#arrowRed)"/>
      <path d="M532 115 C532 175 425 190 375 200" fill="none" stroke="#B33A3A" stroke-width="3" marker-end="url(#arrowRed)"/>
      <rect x="140" y="165" width="320" height="60" rx="7" fill="#FFFFFF" stroke="#972F2F" stroke-width="3"/>
      <text x="300" y="190" font-size="17" font-weight="700" text-anchor="middle" fill="#972F2F">final prediction</text>
      <text x="300" y="213" font-size="15" text-anchor="middle" fill="#455B62">requires broader evidence + interventions</text>
      <text x="22" y="247" font-size="16" fill="#455B62">Large attention weight != causal responsibility.</text>
    </g>
  </g>
</svg>