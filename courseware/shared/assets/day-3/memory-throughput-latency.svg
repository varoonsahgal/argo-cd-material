<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Memory, throughput, latency, and utilization trade-off chart</title>
  <desc id="desc">Two hypothetical configurations compare batch-one latency, throughput, peak memory, and validation score. A meets a fifty millisecond interactive latency target; B provides higher offline throughput under a six gigabyte memory ceiling. A pipeline timeline shows that data, transfer, compute, communication, and checkpoint stages can each limit utilization.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#244B5A"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#F7F5EF"/>
  <text x="55" y="58" font-family="Aptos, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#18333D">Scale creates several scoreboards, not one speed number</text>
  <text x="55" y="94" font-family="Aptos, Helvetica, sans-serif" font-size="19" fill="#455B62">Hypothetical teaching scenario. Choose from the stated constraint; remeasure on the real workload.</text>

  <g font-family="Aptos, Helvetica, sans-serif">
    <g transform="translate(55 135)">
      <rect width="575" height="340" rx="8" fill="#FFFFFF" stroke="#557B83" stroke-width="3"/>
      <text x="25" y="40" font-size="22" font-weight="700" fill="#18333D">CONFIGURATION EVIDENCE</text>
      <text x="365" y="40" font-size="19" font-weight="700" fill="#1F6074">A</text>
      <text x="490" y="40" font-size="19" font-weight="700" fill="#594476">B</text>
      <line x1="25" y1="58" x2="550" y2="58" stroke="#B5B5AE" stroke-width="2"/>
      <g font-size="18" fill="#18333D">
        <text x="25" y="95">batch-1 latency</text><text x="350" y="95" fill="#1F6074" font-weight="700">42 ms</text><text x="475" y="95" fill="#594476" font-weight="700">61 ms</text>
        <text x="25" y="145">throughput</text><text x="350" y="145" fill="#1F6074" font-weight="700">28/s</text><text x="475" y="145" fill="#594476" font-weight="700">74/s</text>
        <text x="25" y="195">peak memory</text><text x="350" y="195" fill="#1F6074" font-weight="700">2.1 GB</text><text x="475" y="195" fill="#594476" font-weight="700">5.8 GB</text>
        <text x="25" y="245">validation score</text><text x="350" y="245" fill="#1F6074" font-weight="700">0.84</text><text x="475" y="245" fill="#594476" font-weight="700">0.85</text>
      </g>
      <line x1="25" y1="270" x2="550" y2="270" stroke="#B5B5AE" stroke-width="2"/>
      <rect x="25" y="286" width="242" height="38" rx="6" fill="#E7F0F2" stroke="#1F6074" stroke-width="2"/>
      <text x="146" y="311" font-size="16" text-anchor="middle" fill="#1F6074">A: interactive, target &lt; 50 ms</text>
      <rect x="285" y="286" width="265" height="38" rx="6" fill="#E9E5F2" stroke="#68548A" stroke-width="2"/>
      <text x="417" y="311" font-size="16" text-anchor="middle" fill="#594476">B: offline, memory ceiling 6 GB</text>
    </g>

    <g transform="translate(675 135)">
      <rect width="550" height="340" rx="8" fill="#FFFFFF" stroke="#557B83" stroke-width="3"/>
      <text x="25" y="40" font-size="22" font-weight="700" fill="#18333D">THE SAME DATA, FOUR DIFFERENT QUESTIONS</text>
      <text x="25" y="83" font-size="17" fill="#18333D">Latency: one-request wait</text>
      <rect x="275" y="65" width="160" height="22" rx="4" fill="#1F6074"/>
      <text x="25" y="128" font-size="17" fill="#18333D">Throughput: work per second</text>
      <rect x="330" y="110" width="190" height="22" rx="4" fill="#68548A"/>
      <text x="25" y="173" font-size="17" fill="#18333D">Memory: peak state that must fit</text>
      <rect x="300" y="155" width="145" height="22" rx="4" fill="#D08A26"/>
      <text x="25" y="218" font-size="17" fill="#18333D">Utilization: productively busy</text>
      <rect x="360" y="200" width="95" height="22" rx="4" fill="#C24A3A"/>
      <text x="25" y="265" font-size="17" font-weight="700" fill="#972F2F">GPU available != GPU utilized</text>
      <text x="25" y="295" font-size="16" fill="#455B62">Profile input wait, transfers, kernels, synchronization,</text>
      <text x="25" y="318" font-size="16" fill="#455B62">concurrency, warm-up, and end-to-end tail latency.</text>
    </g>

    <text x="55" y="525" font-size="21" font-weight="700" fill="#18333D">A bottleneck can move as workload and scale change</text>
    <g transform="translate(55 552)" font-size="16" text-anchor="middle">
      <rect width="180" height="65" rx="7" fill="#D9EBDD" stroke="#28704B" stroke-width="2"/><text x="90" y="28" fill="#18333D">read + transform</text><text x="90" y="50" fill="#455B62">data wait</text>
      <path d="M185 32 H220" stroke="#244B5A" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="230" width="180" height="65" rx="7" fill="#E7F0F2" stroke="#1F6074" stroke-width="2"/><text x="320" y="28" fill="#18333D">host -> device</text><text x="320" y="50" fill="#455B62">movement</text>
      <path d="M415 32 H450" stroke="#244B5A" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="460" width="180" height="65" rx="7" fill="#FFF4D9" stroke="#B27A19" stroke-width="2"/><text x="550" y="28" fill="#18333D">model compute</text><text x="550" y="50" fill="#455B62">kernels + memory</text>
      <path d="M645 32 H680" stroke="#244B5A" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="690" width="180" height="65" rx="7" fill="#E9E5F2" stroke="#68548A" stroke-width="2"/><text x="780" y="28" fill="#18333D">communication</text><text x="780" y="50" fill="#455B62">coordination</text>
      <path d="M875 32 H910" stroke="#244B5A" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="920" width="200" height="65" rx="7" fill="#F2D0CC" stroke="#B33A3A" stroke-width="2"/><text x="1020" y="28" fill="#18333D">checkpoint + serve</text><text x="1020" y="50" fill="#455B62">I/O + reliability</text>
    </g>

    <rect x="55" y="650" width="1170" height="48" rx="7" fill="#E8F1EF" stroke="#157A6E" stroke-width="2"/>
    <text x="75" y="681" font-size="18" font-weight="700" fill="#18333D">Prompt: Which missing measurement could reverse A or B? Tail latency, cost, slices, reliability, or concurrency?</text>
  </g>
</svg>