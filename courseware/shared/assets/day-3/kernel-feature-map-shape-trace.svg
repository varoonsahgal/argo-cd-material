<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Kernel calculation and CNN feature-map shape trace</title>
  <desc id="desc">A three by three vertical edge kernel scans a five by five image to produce a three by three response map. Below, a batch-first shape trace follows two convolution and pooling blocks to 784 flattened features.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#244B5A"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#F7F5EF"/>
  <text x="55" y="58" font-family="Aptos, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#18333D">One shared local detector produces one feature map</text>
  <text x="55" y="92" font-family="Aptos, Helvetica, sans-serif" font-size="19" fill="#455B62">Operation shown is cross-correlation: the kernel is not flipped.</text>

  <g font-family="Aptos, Helvetica, sans-serif">
    <text x="65" y="140" font-size="20" font-weight="700" fill="#244B5A">5 x 5 INPUT</text>
    <g transform="translate(65 165)" stroke="#FFFFFF" stroke-width="2">
      <rect width="55" height="55" fill="#E7E7E2"/><rect x="55" width="55" height="55" fill="#E7E7E2"/><rect x="110" width="55" height="55" fill="#E7E7E2"/><rect x="165" width="55" height="55" fill="#557B83"/><rect x="220" width="55" height="55" fill="#557B83"/>
      <rect y="55" width="55" height="55" fill="#E7E7E2"/><rect x="55" y="55" width="55" height="55" fill="#E7E7E2"/><rect x="110" y="55" width="55" height="55" fill="#E7E7E2"/><rect x="165" y="55" width="55" height="55" fill="#557B83"/><rect x="220" y="55" width="55" height="55" fill="#557B83"/>
      <rect y="110" width="55" height="55" fill="#E7E7E2"/><rect x="55" y="110" width="55" height="55" fill="#E7E7E2"/><rect x="110" y="110" width="55" height="55" fill="#E7E7E2"/><rect x="165" y="110" width="55" height="55" fill="#557B83"/><rect x="220" y="110" width="55" height="55" fill="#557B83"/>
      <rect y="165" width="55" height="55" fill="#E7E7E2"/><rect x="55" y="165" width="55" height="55" fill="#E7E7E2"/><rect x="110" y="165" width="55" height="55" fill="#E7E7E2"/><rect x="165" y="165" width="55" height="55" fill="#557B83"/><rect x="220" y="165" width="55" height="55" fill="#557B83"/>
      <rect y="220" width="55" height="55" fill="#E7E7E2"/><rect x="55" y="220" width="55" height="55" fill="#E7E7E2"/><rect x="110" y="220" width="55" height="55" fill="#E7E7E2"/><rect x="165" y="220" width="55" height="55" fill="#557B83"/><rect x="220" y="220" width="55" height="55" fill="#557B83"/>
      <rect x="55" y="55" width="165" height="165" fill="none" stroke="#D08A26" stroke-width="6"/>
    </g>
    <text x="78" y="465" font-size="17" fill="#455B62">0 = light | 4 = dark</text>

    <text x="420" y="140" font-size="20" font-weight="700" fill="#244B5A">3 x 3 KERNEL</text>
    <g transform="translate(430 185)" font-size="30" text-anchor="middle">
      <rect width="66" height="66" fill="#F2D0CC" stroke="#FFFFFF"/><rect x="66" width="66" height="66" fill="#F0EEE7" stroke="#FFFFFF"/><rect x="132" width="66" height="66" fill="#C8DED9" stroke="#FFFFFF"/>
      <rect y="66" width="66" height="66" fill="#F2D0CC" stroke="#FFFFFF"/><rect x="66" y="66" width="66" height="66" fill="#F0EEE7" stroke="#FFFFFF"/><rect x="132" y="66" width="66" height="66" fill="#C8DED9" stroke="#FFFFFF"/>
      <rect y="132" width="66" height="66" fill="#F2D0CC" stroke="#FFFFFF"/><rect x="66" y="132" width="66" height="66" fill="#F0EEE7" stroke="#FFFFFF"/><rect x="132" y="132" width="66" height="66" fill="#C8DED9" stroke="#FFFFFF"/>
      <g fill="#18333D"><text x="33" y="44">-1</text><text x="99" y="44">0</text><text x="165" y="44">1</text><text x="33" y="110">-1</text><text x="99" y="110">0</text><text x="165" y="110">1</text><text x="33" y="176">-1</text><text x="99" y="176">0</text><text x="165" y="176">1</text></g>
    </g>
    <text x="427" y="420" font-size="18" fill="#455B62">same 9 values at every location</text>
    <path d="M350 300 H410" stroke="#244B5A" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M640 300 H700" stroke="#244B5A" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="720" y="140" font-size="20" font-weight="700" fill="#244B5A">3 x 3 FEATURE MAP</text>
    <g transform="translate(735 185)" font-size="29" text-anchor="middle">
      <rect width="78" height="66" fill="#F0EEE7" stroke="#FFFFFF"/><rect x="78" width="78" height="66" fill="#69AA9F" stroke="#FFFFFF"/><rect x="156" width="78" height="66" fill="#69AA9F" stroke="#FFFFFF"/>
      <rect y="66" width="78" height="66" fill="#F0EEE7" stroke="#FFFFFF"/><rect x="78" y="66" width="78" height="66" fill="#69AA9F" stroke="#FFFFFF"/><rect x="156" y="66" width="78" height="66" fill="#69AA9F" stroke="#FFFFFF"/>
      <rect y="132" width="78" height="66" fill="#F0EEE7" stroke="#FFFFFF"/><rect x="78" y="132" width="78" height="66" fill="#69AA9F" stroke="#FFFFFF"/><rect x="156" y="132" width="78" height="66" fill="#69AA9F" stroke="#FFFFFF"/>
      <g fill="#18333D"><text x="39" y="44">0</text><text x="117" y="44">12</text><text x="195" y="44">12</text><text x="39" y="110">0</text><text x="117" y="110">12</text><text x="195" y="110">12</text><text x="39" y="176">0</text><text x="117" y="176">12</text><text x="195" y="176">12</text></g>
    </g>
    <text x="728" y="420" font-size="18" fill="#455B62">positive response near edge</text>

    <rect x="1000" y="150" width="230" height="275" rx="8" fill="#FFFFFF" stroke="#D08A26" stroke-width="3"/>
    <text x="1020" y="185" font-size="19" font-weight="700" fill="#A86B14">TEACHING LIMIT</text>
    <text x="1020" y="222" font-size="17" fill="#18333D">This hand-designed</text>
    <text x="1020" y="246" font-size="17" fill="#18333D">kernel illustrates the</text>
    <text x="1020" y="270" font-size="17" fill="#18333D">operation.</text>
    <text x="1020" y="310" font-size="17" fill="#18333D">A learned channel needs</text>
    <text x="1020" y="334" font-size="17" fill="#18333D">probe/intervention evidence</text>
    <text x="1020" y="358" font-size="17" fill="#18333D">before naming its role.</text>
  </g>

  <g font-family="Aptos, Helvetica, sans-serif">
    <text x="55" y="515" font-size="21" font-weight="700" fill="#18333D">Batch-first shape trace</text>
    <g transform="translate(55 545)" font-size="17" text-anchor="middle">
      <rect width="190" height="58" rx="7" fill="#E7F0F2" stroke="#1F6074" stroke-width="2"/><text x="95" y="35" fill="#18333D">(B, 1, 28, 28)</text>
      <path d="M195 29 H230" stroke="#244B5A" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="240" width="190" height="58" rx="7" fill="#D9EBDD" stroke="#28704B" stroke-width="2"/><text x="335" y="25" fill="#18333D">conv: (B, 8, 28, 28)</text><text x="335" y="47" font-size="14" fill="#455B62">pool -> (B, 8, 14, 14)</text>
      <path d="M435 29 H470" stroke="#244B5A" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="480" width="210" height="58" rx="7" fill="#FFF4D9" stroke="#B27A19" stroke-width="2"/><text x="585" y="25" fill="#18333D">conv: (B, 16, 14, 14)</text><text x="585" y="47" font-size="14" fill="#455B62">pool -> (B, 16, 7, 7)</text>
      <path d="M695 29 H730" stroke="#244B5A" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="740" width="180" height="58" rx="7" fill="#E9E5F2" stroke="#68548A" stroke-width="2"/><text x="830" y="35" fill="#18333D">flatten: (B, 784)</text>
      <path d="M925 29 H960" stroke="#244B5A" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="970" width="190" height="58" rx="7" fill="#F2D0CC" stroke="#B33A3A" stroke-width="2"/><text x="1065" y="35" fill="#18333D">head: (B, 10)</text>
    </g>
    <text x="55" y="650" font-size="20" font-weight="700" fill="#18333D">Prediction prompt: Which dimensions change under pooling, and which stored weights are reused?</text>
  </g>
</svg>