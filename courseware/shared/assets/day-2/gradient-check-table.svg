<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Analytic and numerical gradient comparison table</title>
  <desc id="desc">A table uses the fixed D2-02 network to compare three analytic gradients with centered finite-difference estimates. Correct values agree below two billionths relative error. A reversed output sign gives maximum relative error one in every layer, while omitting the hidden sigmoid factor affects only hidden-layer gradients.</desc>
  <rect width="1200" height="700" fill="#F7F7F2"/>
  <text x="60" y="72" font-family="Aptos, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#17252A">A backward pass makes a testable numerical claim</text>
  <text x="60" y="112" font-family="Aptos, Helvetica, sans-serif" font-size="21" fill="#485460">Centered finite differences check selected parameters at one point.</text>
  <g font-family="Aptos, Helvetica, sans-serif">
    <rect x="60" y="155" width="1080" height="62" fill="#17252A"/>
    <g font-size="21" font-weight="700" fill="#FFFFFF">
      <text x="85" y="195">Parameter</text><text x="310" y="195">Analytic</text><text x="510" y="195">Numeric</text><text x="700" y="195">Relative error</text><text x="945" y="195">Interpretation</text>
    </g>
    <g font-size="21" fill="#17252A">
      <rect x="60" y="217" width="1080" height="70" fill="#FFFFFF"/><text x="85" y="260">W2[0,0]</text><text x="310" y="260">-0.171491679</text><text x="510" y="260">-0.171491679</text><text x="700" y="260">1.216e-10</text><text x="945" y="260" fill="#4E7C46" font-weight="700">agrees</text>
      <rect x="60" y="287" width="1080" height="70" fill="#EAF3E7"/><text x="85" y="330">b2[0]</text><text x="310" y="330">-0.490282370</text><text x="510" y="330">-0.490282370</text><text x="700" y="330">7.912e-11</text><text x="945" y="330" fill="#4E7C46" font-weight="700">agrees</text>
      <rect x="60" y="357" width="1080" height="70" fill="#FFFFFF"/><text x="85" y="400">W1[0,0]</text><text x="310" y="400">-0.033452121</text><text x="510" y="400">-0.033452121</text><text x="700" y="400">1.012e-09</text><text x="945" y="400" fill="#4E7C46" font-weight="700">agrees</text>
      <rect x="60" y="450" width="1080" height="70" fill="#F8DDDD"/><text x="85" y="493">sign bug</text><text x="310" y="493">all layers</text><text x="510" y="493">all disagree</text><text x="700" y="493">1.000 max</text><text x="945" y="493" fill="#B73E3E" font-weight="700">opposite sign</text>
      <rect x="60" y="520" width="1080" height="70" fill="#FFF0C7"/><text x="85" y="563">missing factor</text><text x="310" y="563">W1 / b1 only</text><text x="510" y="563">W2 / b2 agree</text><text x="700" y="563">0.648 hidden</text><text x="945" y="563" fill="#A06A00" font-weight="700">localized factor</text>
    </g>
    <text x="60" y="640" font-size="20" fill="#485460">Agreement supports the derivative implementation here; it does not validate the data, objective, or model usefulness.</text>
  </g>
</svg>