<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Computational graph with forward values and backward gradients</title>
  <desc id="desc">For w equals 1, the graph computes u equals 2w, q equals u plus 1, and L equals q squared. Forward values are 1, 2, 3, and 9. Backward local derivatives multiply to give dL over dw equals 12.</desc>
  <defs>
    <marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176B87"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#B73E3E"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#F7F7F2"/>
  <text x="70" y="75" font-family="Aptos, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#17252A">One graph, two traces</text>
  <text x="70" y="115" font-family="Aptos, Helvetica, sans-serif" font-size="21" fill="#485460">Forward values above. Backward sensitivities below.</text>
  <g font-family="Aptos, Helvetica, sans-serif">
    <circle cx="130" cy="320" r="67" fill="#FFFFFF" stroke="#176B87" stroke-width="5"/>
    <text x="130" y="310" text-anchor="middle" font-size="27" font-weight="700" fill="#17252A">w = 1</text>
    <text x="130" y="346" text-anchor="middle" font-size="18" fill="#485460">parameter</text>
    <circle cx="430" cy="320" r="67" fill="#FFFFFF" stroke="#176B87" stroke-width="5"/>
    <text x="430" y="310" text-anchor="middle" font-size="27" font-weight="700" fill="#17252A">u = 2</text>
    <text x="430" y="346" text-anchor="middle" font-size="18" fill="#485460">u = 2w</text>
    <circle cx="730" cy="320" r="67" fill="#FFFFFF" stroke="#176B87" stroke-width="5"/>
    <text x="730" y="310" text-anchor="middle" font-size="27" font-weight="700" fill="#17252A">q = 3</text>
    <text x="730" y="346" text-anchor="middle" font-size="18" fill="#485460">q = u + 1</text>
    <circle cx="1030" cy="320" r="67" fill="#FFF0C7" stroke="#A06A00" stroke-width="5"/>
    <text x="1030" y="310" text-anchor="middle" font-size="27" font-weight="700" fill="#17252A">L = 9</text>
    <text x="1030" y="346" text-anchor="middle" font-size="18" fill="#485460">L = q squared</text>
    <path d="M197 300 H363" stroke="#176B87" stroke-width="6" marker-end="url(#f)"/>
    <path d="M497 300 H663" stroke="#176B87" stroke-width="6" marker-end="url(#f)"/>
    <path d="M797 300 H963" stroke="#176B87" stroke-width="6" marker-end="url(#f)"/>
    <text x="280" y="270" text-anchor="middle" font-size="19" fill="#176B87">forward</text>
    <path d="M963 370 H797" stroke="#B73E3E" stroke-width="6" marker-end="url(#b)"/>
    <path d="M663 370 H497" stroke="#B73E3E" stroke-width="6" marker-end="url(#b)"/>
    <path d="M363 370 H197" stroke="#B73E3E" stroke-width="6" marker-end="url(#b)"/>
    <text x="880" y="415" text-anchor="middle" font-size="21" font-weight="700" fill="#B73E3E">dL/dq = 6</text>
    <text x="580" y="415" text-anchor="middle" font-size="21" font-weight="700" fill="#B73E3E">dq/du = 1</text>
    <text x="280" y="415" text-anchor="middle" font-size="21" font-weight="700" fill="#B73E3E">du/dw = 2</text>
    <rect x="245" y="500" width="710" height="105" rx="8" fill="#F8DDDD" stroke="#B73E3E" stroke-width="3"/>
    <text x="600" y="545" text-anchor="middle" font-size="29" font-weight="700" fill="#17252A">dL/dw = 6 x 1 x 2 = 12</text>
    <text x="600" y="579" text-anchor="middle" font-size="19" fill="#485460">upstream gradient x local derivative at each edge</text>
  </g>
</svg>