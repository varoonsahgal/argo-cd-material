<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Batch shape map for one, 32, and 1024 examples</title>
  <desc id="desc">Three rows show X with shapes 1 by 4, 32 by 4, and 1024 by 4 multiplied by the same W shape 4 by 8, plus the same bias shape 8, producing outputs with shapes 1 by 8, 32 by 8, and 1024 by 8.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#485460"/></marker></defs>
  <rect width="1200" height="700" fill="#F7F7F2"/>
  <text x="60" y="70" font-family="Aptos, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#17252A">Batch size changes rows, not trainable shapes</text>
  <text x="60" y="108" font-family="Aptos, Helvetica, sans-serif" font-size="21" fill="#485460">The feature dimension 4 contracts. One bias vector broadcasts across examples.</text>
  <g font-family="Aptos, Helvetica, sans-serif">
    <g transform="translate(55,165)">
      <text x="0" y="62" font-size="24" font-weight="700" fill="#17252A">B = 1</text>
      <rect x="115" y="15" width="160" height="90" fill="#DCEFF4" stroke="#176B87" stroke-width="3"/><text x="195" y="55" text-anchor="middle" font-size="24" font-weight="700">X</text><text x="195" y="84" text-anchor="middle" font-size="19">(1, 4)</text>
      <text x="295" y="70" font-size="31">@</text>
      <rect x="340" y="15" width="160" height="90" fill="#E9E0F4" stroke="#71578A" stroke-width="3"/><text x="420" y="55" text-anchor="middle" font-size="24" font-weight="700">W</text><text x="420" y="84" text-anchor="middle" font-size="19">(4, 8)</text>
      <text x="520" y="70" font-size="31">+</text>
      <rect x="565" y="15" width="160" height="90" fill="#FFF0C7" stroke="#A06A00" stroke-width="3"/><text x="645" y="55" text-anchor="middle" font-size="24" font-weight="700">b</text><text x="645" y="84" text-anchor="middle" font-size="19">(8,)</text>
      <path d="M750 60 H830" stroke="#485460" stroke-width="5" marker-end="url(#a)"/>
      <rect x="850" y="15" width="200" height="90" fill="#E4F1DF" stroke="#4E7C46" stroke-width="3"/><text x="950" y="55" text-anchor="middle" font-size="24" font-weight="700">Z</text><text x="950" y="84" text-anchor="middle" font-size="19">(1, 8)</text>
    </g>
    <g transform="translate(55,325)">
      <text x="0" y="62" font-size="24" font-weight="700" fill="#17252A">B = 32</text>
      <rect x="115" y="0" width="160" height="120" fill="#DCEFF4" stroke="#176B87" stroke-width="3"/><text x="195" y="55" text-anchor="middle" font-size="24" font-weight="700">X</text><text x="195" y="86" text-anchor="middle" font-size="19">(32, 4)</text>
      <text x="295" y="70" font-size="31">@</text>
      <rect x="340" y="15" width="160" height="90" fill="#E9E0F4" stroke="#71578A" stroke-width="3"/><text x="420" y="55" text-anchor="middle" font-size="24" font-weight="700">W</text><text x="420" y="84" text-anchor="middle" font-size="19">(4, 8)</text>
      <text x="520" y="70" font-size="31">+</text>
      <rect x="565" y="15" width="160" height="90" fill="#FFF0C7" stroke="#A06A00" stroke-width="3"/><text x="645" y="55" text-anchor="middle" font-size="24" font-weight="700">b</text><text x="645" y="84" text-anchor="middle" font-size="19">(8,)</text>
      <path d="M750 60 H830" stroke="#485460" stroke-width="5" marker-end="url(#a)"/>
      <rect x="850" y="0" width="200" height="120" fill="#E4F1DF" stroke="#4E7C46" stroke-width="3"/><text x="950" y="55" text-anchor="middle" font-size="24" font-weight="700">Z</text><text x="950" y="86" text-anchor="middle" font-size="19">(32, 8)</text>
    </g>
    <g transform="translate(55,515)">
      <text x="0" y="62" font-size="24" font-weight="700" fill="#17252A">B = 1024</text>
      <rect x="115" y="-20" width="160" height="160" fill="#DCEFF4" stroke="#176B87" stroke-width="3"/><text x="195" y="55" text-anchor="middle" font-size="24" font-weight="700">X</text><text x="195" y="86" text-anchor="middle" font-size="19">(1024, 4)</text>
      <text x="295" y="70" font-size="31">@</text>
      <rect x="340" y="15" width="160" height="90" fill="#E9E0F4" stroke="#71578A" stroke-width="3"/><text x="420" y="55" text-anchor="middle" font-size="24" font-weight="700">W</text><text x="420" y="84" text-anchor="middle" font-size="19">(4, 8)</text>
      <text x="520" y="70" font-size="31">+</text>
      <rect x="565" y="15" width="160" height="90" fill="#FFF0C7" stroke="#A06A00" stroke-width="3"/><text x="645" y="55" text-anchor="middle" font-size="24" font-weight="700">b</text><text x="645" y="84" text-anchor="middle" font-size="19">(8,)</text>
      <path d="M750 60 H830" stroke="#485460" stroke-width="5" marker-end="url(#a)"/>
      <rect x="850" y="-20" width="200" height="160" fill="#E4F1DF" stroke="#4E7C46" stroke-width="3"/><text x="950" y="55" text-anchor="middle" font-size="24" font-weight="700">Z</text><text x="950" y="86" text-anchor="middle" font-size="19">(1024, 8)</text>
    </g>
  </g>
</svg>