<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Four parameter-position trajectories under different learning rates</title>
  <desc id="desc">Four panels plot parameter position w over six updates for the same quadratic. Learning rates 0.01 and 0.10 approach w equals 3 from one side, 0.90 alternates around it with shrinking distance, and 1.10 alternates with expanding distance. Each title reports the corresponding loss change.</desc>
  <rect width="1200" height="700" fill="#F7F7F2"/>
  <text x="60" y="66" font-family="Aptos, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#17252A">Learning rate changes the path, not the destination label</text>
  <text x="60" y="105" font-family="Aptos, Helvetica, sans-serif" font-size="21" fill="#485460">Lines show parameter position w. Dashed line is the optimum w=3. All panels use the same axes.</text>
  <g font-family="Aptos, Helvetica, sans-serif" font-size="20">
    <g transform="translate(60,145)">
      <rect width="515" height="225" fill="#FFFFFF" stroke="#AAB2B6" stroke-width="2"/>
      <text x="18" y="31" font-size="22" font-weight="700" fill="#176B87">eta 0.01 | crawl | loss 16 to 12.56</text>
      <line x1="55" y1="180" x2="475" y2="180" stroke="#485460"/><line x1="55" y1="50" x2="55" y2="180" stroke="#485460"/>
      <line x1="55" y1="107" x2="475" y2="107" stroke="#A06A00" stroke-width="2" stroke-dasharray="8 7"/>
      <polyline points="55,129 115,129 175,128 235,128 295,127 355,127 415,127" fill="none" stroke="#176B87" stroke-width="6"/>
      <text x="250" y="212" text-anchor="middle" fill="#485460">update step</text><text x="22" y="120" transform="rotate(-90 22 120)" text-anchor="middle" fill="#485460">w position</text>
    </g>
    <g transform="translate(625,145)">
      <rect width="515" height="225" fill="#FFFFFF" stroke="#AAB2B6" stroke-width="2"/>
      <text x="18" y="31" font-size="22" font-weight="700" fill="#4E7C46">eta 0.10 | smooth | loss 16 to 1.10</text>
      <line x1="55" y1="180" x2="475" y2="180" stroke="#485460"/><line x1="55" y1="50" x2="55" y2="180" stroke="#485460"/>
      <line x1="55" y1="107" x2="475" y2="107" stroke="#A06A00" stroke-width="2" stroke-dasharray="8 7"/>
      <polyline points="55,129 115,125 175,121 235,118 295,116 355,114 415,112" fill="none" stroke="#4E7C46" stroke-width="6"/>
      <text x="250" y="212" text-anchor="middle" fill="#485460">update step</text><text x="22" y="120" transform="rotate(-90 22 120)" text-anchor="middle" fill="#485460">w position</text>
    </g>
    <g transform="translate(60,420)">
      <rect width="515" height="225" fill="#FFFFFF" stroke="#AAB2B6" stroke-width="2"/>
      <text x="18" y="31" font-size="22" font-weight="700" fill="#A06A00">eta 0.90 | crosses | loss 16 to 1.10</text>
      <line x1="55" y1="180" x2="475" y2="180" stroke="#485460"/><line x1="55" y1="50" x2="55" y2="180" stroke="#485460"/>
      <line x1="55" y1="107" x2="475" y2="107" stroke="#A06A00" stroke-width="2" stroke-dasharray="8 7"/>
      <polyline points="55,129 115,88 175,121 235,95 295,116 355,99 415,112" fill="none" stroke="#A06A00" stroke-width="6"/>
      <text x="250" y="212" text-anchor="middle" fill="#485460">update step</text><text x="22" y="120" transform="rotate(-90 22 120)" text-anchor="middle" fill="#485460">w position</text>
    </g>
    <g transform="translate(625,420)">
      <rect width="515" height="225" fill="#FFFFFF" stroke="#AAB2B6" stroke-width="2"/>
      <text x="18" y="31" font-size="22" font-weight="700" fill="#B73E3E">eta 1.10 | expands | loss 16 to 142.66</text>
      <line x1="55" y1="180" x2="475" y2="180" stroke="#485460"/><line x1="55" y1="50" x2="55" y2="180" stroke="#485460"/>
      <line x1="55" y1="107" x2="475" y2="107" stroke="#A06A00" stroke-width="2" stroke-dasharray="8 7"/>
      <polyline points="55,129 115,79 175,139 235,68 295,153 355,50 415,174" fill="none" stroke="#B73E3E" stroke-width="6"/>
      <text x="250" y="212" text-anchor="middle" fill="#485460">update step</text><text x="22" y="120" transform="rotate(-90 22 120)" text-anchor="middle" fill="#485460">w position</text>
    </g>
  </g>
</svg>