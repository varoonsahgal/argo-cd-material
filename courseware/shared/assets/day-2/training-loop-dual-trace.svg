<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Training loop with forward values and backward sensitivities</title>
  <desc id="desc">Six stages form a loop. Initialization leads to forward prediction and scalar loss. Gradients flow backward, an optimizer updates parameters, and the next batch repeats the process. Inference uses only the forward path.</desc>
  <defs>
    <marker id="arrowForward" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176B87"/></marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#B73E3E"/></marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#485460"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#F7F7F2"/>
  <text x="70" y="74" font-family="Aptos, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#17252A">One training iteration</text>
  <text x="70" y="112" font-family="Aptos, Helvetica, sans-serif" font-size="22" fill="#485460">Values move forward. Sensitivities move backward. The update happens after both.</text>
  <g font-family="Aptos, Helvetica, sans-serif">
    <rect x="70" y="220" width="190" height="118" rx="8" fill="#E7ECEF" stroke="#485460" stroke-width="3"/>
    <text x="165" y="266" text-anchor="middle" font-size="25" font-weight="700" fill="#17252A">Initialize</text>
    <text x="165" y="301" text-anchor="middle" font-size="19" fill="#485460">parameters</text>
    <rect x="315" y="220" width="190" height="118" rx="8" fill="#DCEFF4" stroke="#176B87" stroke-width="3"/>
    <text x="410" y="266" text-anchor="middle" font-size="25" font-weight="700" fill="#17252A">Forward</text>
    <text x="410" y="301" text-anchor="middle" font-size="19" fill="#485460">logits / outputs</text>
    <rect x="560" y="220" width="190" height="118" rx="8" fill="#FFF0C7" stroke="#A06A00" stroke-width="3"/>
    <text x="655" y="266" text-anchor="middle" font-size="25" font-weight="700" fill="#17252A">Loss</text>
    <text x="655" y="301" text-anchor="middle" font-size="19" fill="#485460">one scalar signal</text>
    <rect x="805" y="220" width="190" height="118" rx="8" fill="#F8DDDD" stroke="#B73E3E" stroke-width="3"/>
    <text x="900" y="266" text-anchor="middle" font-size="25" font-weight="700" fill="#17252A">Backward</text>
    <text x="900" y="301" text-anchor="middle" font-size="19" fill="#485460">parameter gradients</text>
    <rect x="805" y="440" width="190" height="118" rx="8" fill="#E9E0F4" stroke="#71578A" stroke-width="3"/>
    <text x="900" y="486" text-anchor="middle" font-size="25" font-weight="700" fill="#17252A">Update</text>
    <text x="900" y="521" text-anchor="middle" font-size="19" fill="#485460">optimizer step</text>
    <rect x="315" y="440" width="190" height="118" rx="8" fill="#E4F1DF" stroke="#4E7C46" stroke-width="3"/>
    <text x="410" y="486" text-anchor="middle" font-size="25" font-weight="700" fill="#17252A">Next batch</text>
    <text x="410" y="521" text-anchor="middle" font-size="19" fill="#485460">repeat iteration</text>
  </g>
  <path d="M260 279 H315" stroke="#176B87" stroke-width="6" marker-end="url(#arrowForward)"/>
  <path d="M505 279 H560" stroke="#176B87" stroke-width="6" marker-end="url(#arrowForward)"/>
  <path d="M750 279 H805" stroke="#B73E3E" stroke-width="6" marker-end="url(#arrowBack)"/>
  <path d="M900 338 V440" stroke="#B73E3E" stroke-width="6" marker-end="url(#arrowBack)"/>
  <path d="M805 499 H505" stroke="#485460" stroke-width="6" marker-end="url(#arrowLoop)"/>
  <path d="M410 440 V338" stroke="#485460" stroke-width="6" marker-end="url(#arrowLoop)"/>
  <text x="413" y="190" text-anchor="middle" font-family="Aptos, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#176B87">FORWARD VALUES</text>
  <text x="886" y="190" text-anchor="middle" font-family="Aptos, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#B73E3E">BACKWARD SENSITIVITY</text>
  <path d="M315 620 H750" stroke="#176B87" stroke-width="4" marker-end="url(#arrowForward)"/>
  <text x="532" y="655" text-anchor="middle" font-family="Aptos, Helvetica, sans-serif" font-size="20" fill="#176B87">Inference uses the forward path with fixed parameters</text>
</svg>