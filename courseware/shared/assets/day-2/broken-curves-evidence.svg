<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Non-unique broken training curves with discriminating evidence</title>
  <desc id="desc">Three curve cards show a flat near-baseline run, a jagged unstable run, and inconsistent repeated validation. Each card lists multiple plausible causes and one discriminating evidence request, emphasizing that curves are not unique fingerprints.</desc>
  <rect width="1200" height="700" fill="#F7F7F2"/>
  <text x="55" y="66" font-family="Aptos, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#17252A">A symptom narrows possibilities; a check separates them</text>
  <text x="55" y="105" font-family="Aptos, Helvetica, sans-serif" font-size="21" fill="#485460">Each curve supports several hypotheses. Code stays hidden until a discriminating check is chosen.</text>
  <g font-family="Aptos, Helvetica, sans-serif">
    <g transform="translate(45,145)">
      <rect width="350" height="490" rx="8" fill="#FFFFFF" stroke="#176B87" stroke-width="4"/>
      <text x="24" y="42" font-size="28" font-weight="700" fill="#176B87">Card A: stalled</text>
      <line x1="45" y1="215" x2="315" y2="215" stroke="#485460"/><line x1="45" y1="75" x2="45" y2="215" stroke="#485460"/>
      <polyline points="45,90 90,120 135,139 180,148 225,151 270,152 315,152" fill="none" stroke="#176B87" stroke-width="6"/>
      <text x="24" y="258" font-size="20" font-weight="700">Plausible:</text>
      <text x="24" y="289" font-size="18">missing nonlinearity</text><text x="24" y="318" font-size="18">low effective update</text><text x="24" y="347" font-size="18">weak signal / wrong contract</text>
      <text x="24" y="395" font-size="20" font-weight="700" fill="#A06A00">Ask first:</text>
      <text x="24" y="426" font-size="18">activation and boundary</text><text x="24" y="455" font-size="18">evidence under matched settings</text>
    </g>
    <g transform="translate(425,145)">
      <rect width="350" height="490" rx="8" fill="#FFFFFF" stroke="#B73E3E" stroke-width="4"/>
      <text x="24" y="42" font-size="28" font-weight="700" fill="#B73E3E">Card B: unstable</text>
      <line x1="45" y1="215" x2="315" y2="215" stroke="#485460"/><line x1="45" y1="75" x2="45" y2="215" stroke="#485460"/>
      <polyline points="45,175 90,142 135,164 180,112 225,151 270,82 315,135" fill="none" stroke="#B73E3E" stroke-width="6"/>
      <text x="24" y="258" font-size="20" font-weight="700">Plausible:</text>
      <text x="24" y="289" font-size="18">omitted gradient reset</text><text x="24" y="318" font-size="18">excessive learning rate</text><text x="24" y="347" font-size="18">invalid inputs / non-finite path</text>
      <text x="24" y="395" font-size="20" font-weight="700" fill="#A06A00">Ask first:</text>
      <text x="24" y="426" font-size="18">gradient state before reset,</text><text x="24" y="455" font-size="18">after reset, after backward</text>
    </g>
    <g transform="translate(805,145)">
      <rect width="350" height="490" rx="8" fill="#FFFFFF" stroke="#71578A" stroke-width="4"/>
      <text x="24" y="42" font-size="28" font-weight="700" fill="#71578A">Card C: inconsistent</text>
      <line x1="45" y1="215" x2="315" y2="215" stroke="#485460"/><line x1="45" y1="75" x2="45" y2="215" stroke="#485460"/>
      <polyline points="45,145 90,122 135,158 180,115 225,161 270,120 315,151" fill="none" stroke="#71578A" stroke-width="6"/>
      <text x="24" y="258" font-size="20" font-weight="700">Plausible:</text>
      <text x="24" y="289" font-size="18">evaluation left in train mode</text><text x="24" y="318" font-size="18">stochastic data transform</text><text x="24" y="347" font-size="18">mutable state elsewhere</text>
      <text x="24" y="395" font-size="20" font-weight="700" fill="#A06A00">Ask first:</text>
      <text x="24" y="426" font-size="18">fixed-batch repeats plus</text><text x="24" y="455" font-size="18">mode and grad state separately</text>
    </g>
  </g>
</svg>