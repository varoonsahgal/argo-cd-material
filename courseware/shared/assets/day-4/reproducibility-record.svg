<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Reproducibility record comparison</title><desc id="desc">Two experiment records share a seed, but the incomplete record lacks split hash, environment, metric threshold, checkpoint, raw repeats, and timing method. A boundary states that repeatability is claimed only within a recorded environment and tolerance.</desc><rect width="1200" height="620" fill="#F7F5EF"/><text x="55" y="55" font-family="Aptos, sans-serif" font-size="34" font-weight="700" fill="#18333D">Same seed is not the same experiment record</text><g font-family="Aptos, sans-serif"><g transform="translate(70 100)"><rect width="470" height="410" rx="8" fill="#FBE4E1" stroke="#B33A3A" stroke-width="3"/><text x="28" y="45" font-size="28" font-weight="700" fill="#972F2F">Incomplete record</text><text x="30" y="95" font-size="22" fill="#18333D">[x] architecture</text><text x="30" y="135" font-size="22" fill="#18333D">[x] seed = 17</text><text x="30" y="175" font-size="22" fill="#972F2F">[ ] split hash / transforms</text><text x="30" y="215" font-size="22" fill="#972F2F">[ ] packages / device / threads</text><text x="30" y="255" font-size="22" fill="#972F2F">[ ] metric averaging / threshold</text><text x="30" y="295" font-size="22" fill="#972F2F">[ ] checkpoint rule</text><text x="30" y="335" font-size="22" fill="#972F2F">[ ] raw repeat + tolerance</text><text x="30" y="375" font-size="22" fill="#972F2F">[ ] timing warm-up / repeats</text></g><g transform="translate(660 100)"><rect width="470" height="410" rx="8" fill="#E5F0E8" stroke="#4C8662" stroke-width="3"/><text x="28" y="45" font-size="28" font-weight="700" fill="#285C3B">Usable team record</text><text x="30" y="95" font-size="22" fill="#18333D">[x] code + architecture/config</text><text x="30" y="135" font-size="22" fill="#18333D">[x] data / split / transforms</text><text x="30" y="175" font-size="22" fill="#18333D">[x] RNGs + environment</text><text x="30" y="215" font-size="22" fill="#18333D">[x] metric / threshold / slices</text><text x="30" y="255" font-size="22" fill="#18333D">[x] checkpoint selection rule</text><text x="30" y="295" font-size="22" fill="#18333D">[x] raw repeats + tolerance</text><text x="30" y="335" font-size="22" fill="#18333D">[x] timing method / workload</text><text x="30" y="375" font-size="22" fill="#18333D">[x] result + limitation + next</text></g><rect x="205" y="545" width="790" height="50" rx="6" fill="#FFF4D9" stroke="#B27A19" stroke-width="3"/><text x="600" y="578" text-anchor="middle" font-size="22" font-weight="700" fill="#7B5311">Claim: repeatable within this environment and tolerance, not identical everywhere.</text></g></svg>