<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Error analysis funnel</title><desc id="desc">A funnel moves from all validation examples to errors, confusion pairs, confidence bands, metadata slices, and inspected examples, ending in a prioritized experiment based on prevalence, consequence, and fixability.</desc><rect width="1200" height="620" fill="#F7F5EF"/><text x="55" y="55" font-family="Aptos, sans-serif" font-size="34" font-weight="700" fill="#18333D">From average to actionable work queue</text><g font-family="Aptos, sans-serif" text-anchor="middle"><polygon points="90,100 1110,100 1025,170 175,170" fill="#DDE9EC"/><text x="600" y="143" font-size="24" fill="#18333D">all validation examples</text><polygon points="175,185 1025,185 945,255 255,255" fill="#C8DEE4"/><text x="600" y="228" font-size="24" fill="#18333D">all errors + confusion pairs</text><polygon points="255,270 945,270 865,340 335,340" fill="#A8CCD6"/><text x="600" y="313" font-size="24" fill="#18333D">confidence bands + metadata slices</text><polygon points="335,355 865,355 785,425 415,425" fill="#86B5C2"/><text x="600" y="398" font-size="24" fill="#18333D">counted buckets + inspected examples</text><polygon points="415,440 785,440 705,510 495,510" fill="#5E95A5"/><text x="600" y="483" font-size="24" fill="#FFF">candidate interventions</text><rect x="360" y="535" width="480" height="55" rx="6" fill="#FFF4D9" stroke="#B27A19" stroke-width="3"/><text x="600" y="570" font-size="23" font-weight="700" fill="#7B5311">priority = prevalence x consequence x addressable share</text></g><text x="45" y="312" transform="rotate(-90 45 312)" font-family="Aptos, sans-serif" font-size="21" fill="#B33A3A">quantify before selecting examples</text><text x="1155" y="300" transform="rotate(90 1155 300)" font-family="Aptos, sans-serif" font-size="21" fill="#315F70">alternatives before intervention</text></svg>