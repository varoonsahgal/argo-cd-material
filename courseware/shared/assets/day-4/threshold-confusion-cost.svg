<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Threshold, confusion counts, and cost move together</title><desc id="desc">Three operating points show a threshold moving from high to low. Predicted positives increase, false negatives fall, false positives rise, and two cost scenarios prefer different operating points.</desc>
<rect width="1200" height="620" fill="#F7F5EF"/><text x="55" y="55" font-family="Aptos, sans-serif" font-size="34" font-weight="700" fill="#18333D">Same scores, different operating decisions</text>
<line x1="130" y1="125" x2="1070" y2="125" stroke="#315F70" stroke-width="8"/><polygon points="1085,125 1055,108 1055,142" fill="#315F70"/><text x="90" y="105" font-family="Aptos, sans-serif" font-size="20" fill="#315F70">higher threshold</text><text x="960" y="105" font-family="Aptos, sans-serif" font-size="20" fill="#315F70">lower threshold</text>
<g font-family="Aptos, sans-serif"><g transform="translate(65 165)"><rect width="320" height="365" rx="8" fill="#FFFFFF" stroke="#315F70" stroke-width="3"/><text x="20" y="42" font-size="28" font-weight="700" fill="#18333D">t = 0.70</text><text x="20" y="78" font-size="19" fill="#495A61">Few positive decisions</text><g transform="translate(35 105)"><rect width="110" height="70" fill="#D8E8DD"/><rect x="110" width="110" height="70" fill="#F5C8BE"/><rect y="70" width="110" height="70" fill="#F3B36A"/><rect x="110" y="70" width="110" height="70" fill="#8FC4A4"/><text x="35" y="42" font-size="19">TN 950</text><text x="142" y="42" font-size="19">FP 10</text><text x="33" y="112" font-size="19">FN 22</text><text x="140" y="112" font-size="19">TP 18</text></g><text x="35" y="280" font-size="19" fill="#972F2F">Recall 0.45</text><text x="175" y="280" font-size="19" fill="#315F70">Precision 0.64</text><text x="35" y="320" font-size="18" fill="#18333D">Miss-heavy cost: high</text><text x="35" y="348" font-size="18" fill="#18333D">Review-heavy cost: low</text></g>
<g transform="translate(440 165)"><rect width="320" height="365" rx="8" fill="#FFFFFF" stroke="#315F70" stroke-width="3"/><text x="20" y="42" font-size="28" font-weight="700" fill="#18333D">t = 0.50</text><text x="20" y="78" font-size="19" fill="#495A61">Middle operating point</text><g transform="translate(35 105)"><rect width="110" height="70" fill="#D8E8DD"/><rect x="110" width="110" height="70" fill="#F5C8BE"/><rect y="70" width="110" height="70" fill="#F3B36A"/><rect x="110" y="70" width="110" height="70" fill="#8FC4A4"/><text x="35" y="42" font-size="19">TN 930</text><text x="142" y="42" font-size="19">FP 30</text><text x="33" y="112" font-size="19">FN 12</text><text x="140" y="112" font-size="19">TP 28</text></g><text x="35" y="280" font-size="19" fill="#972F2F">Recall 0.70</text><text x="175" y="280" font-size="19" fill="#315F70">Precision 0.48</text><text x="35" y="320" font-size="18" fill="#18333D">Costs depend on scenario</text></g>
<g transform="translate(815 165)"><rect width="320" height="365" rx="8" fill="#FFFFFF" stroke="#315F70" stroke-width="3"/><text x="20" y="42" font-size="28" font-weight="700" fill="#18333D">t = 0.30</text><text x="20" y="78" font-size="19" fill="#495A61">Many positive decisions</text><g transform="translate(35 105)"><rect width="110" height="70" fill="#D8E8DD"/><rect x="110" width="110" height="70" fill="#F5C8BE"/><rect y="70" width="110" height="70" fill="#F3B36A"/><rect x="110" y="70" width="110" height="70" fill="#8FC4A4"/><text x="35" y="42" font-size="19">TN 880</text><text x="140" y="42" font-size="19">FP 80</text><text x="38" y="112" font-size="19">FN 4</text><text x="140" y="112" font-size="19">TP 36</text></g><text x="35" y="280" font-size="19" fill="#972F2F">Recall 0.90</text><text x="175" y="280" font-size="19" fill="#315F70">Precision 0.31</text><text x="35" y="320" font-size="18" fill="#18333D">Miss-heavy cost: low</text><text x="35" y="348" font-size="18" fill="#18333D">Review-heavy cost: high</text></g></g>
<text x="55" y="585" font-family="Aptos, sans-serif" font-size="23" font-weight="700" fill="#B33A3A">Moving the threshold changes decisions, not learned parameters or score ranking.</text></svg>