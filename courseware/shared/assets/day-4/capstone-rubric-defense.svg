<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Capstone weighted rubric and five-minute defense</title>
  <desc id="desc">A horizontal weighted rubric shows performance 25, generalization 20, experiment design 20, diagnosis 15, efficiency 10, and explanation 10. Below it, five one-minute defense stages cover baseline, evidence, experiment, result, and decision.</desc>
  <rect width="1200" height="620" fill="#F7F5EF"/>
  <text x="55" y="52" font-family="Aptos, sans-serif" font-size="34" font-weight="700" fill="#18333D">The highest score is not automatically the strongest work</text>
  <g font-family="Aptos, sans-serif">
    <g transform="translate(55 95)">
      <rect width="272" height="80" fill="#315F70"/>
      <rect x="272" width="218" height="80" fill="#4C8662"/>
      <rect x="490" width="218" height="80" fill="#B27A19"/>
      <rect x="708" width="163" height="80" fill="#8A5360"/>
      <rect x="871" width="109" height="80" fill="#687A80"/>
      <rect x="980" width="109" height="80" fill="#B33A3A"/>
      <g fill="#FFF" font-size="18" font-weight="700" text-anchor="middle">
        <text x="136" y="34">Performance</text>
        <text x="136" y="60">25</text>
        <text x="381" y="34">Generalization</text>
        <text x="381" y="60">20</text>
        <text x="599" y="34">Experiment design</text>
        <text x="599" y="60">20</text>
        <text x="790" y="34">Diagnosis</text>
        <text x="790" y="60">15</text>
        <text x="925" y="34">Efficiency</text>
        <text x="925" y="60">10</text>
        <text x="1035" y="34">Explanation</text>
        <text x="1035" y="60">10</text>
      </g>
    </g>
    <text x="55" y="225" font-size="25" font-weight="700" fill="#285C3B">A controlled negative result can earn full reasoning credit.</text>
    <g transform="translate(55 270)" text-anchor="middle">
      <g fill="#FFF" stroke="#315F70" stroke-width="3">
        <rect width="205" height="180" rx="8"/>
        <rect x="220" width="205" height="180" rx="8"/>
        <rect x="440" width="205" height="180" rx="8"/>
        <rect x="660" width="205" height="180" rx="8"/>
        <rect x="880" width="205" height="180" rx="8"/>
      </g>
      <g fill="#18333D">
        <text x="102" y="45" font-size="28" font-weight="700">Minute 1</text>
        <text x="102" y="85" font-size="22">Baseline</text>
        <text x="102" y="120" font-size="18">wrong or uncertain</text>
        <text x="322" y="45" font-size="28" font-weight="700">Minute 2</text>
        <text x="322" y="85" font-size="22">Evidence</text>
        <text x="322" y="120" font-size="18">support + threat</text>
        <text x="542" y="45" font-size="28" font-weight="700">Minute 3</text>
        <text x="542" y="85" font-size="22">Experiment</text>
        <text x="542" y="120" font-size="18">change + prediction</text>
        <text x="762" y="45" font-size="28" font-weight="700">Minute 4</text>
        <text x="762" y="85" font-size="22">Result</text>
        <text x="762" y="120" font-size="18">quality + resources</text>
        <text x="982" y="45" font-size="28" font-weight="700">Minute 5</text>
        <text x="982" y="85" font-size="22">Decision</text>
        <text x="982" y="120" font-size="18">why + next + limit</text>
      </g>
    </g>
    <rect x="250" y="510" width="700" height="65" rx="8" fill="#FFF4D9" stroke="#B27A19" stroke-width="3"/>
    <text x="600" y="538" text-anchor="middle" font-size="20" font-weight="700" fill="#7B5311">Team score and individual check are separate.</text>
    <text x="600" y="562" text-anchor="middle" font-size="20" font-weight="700" fill="#7B5311">Test access remains locked until the decision is fixed.</text>
  </g>
</svg>
