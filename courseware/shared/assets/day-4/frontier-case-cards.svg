<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Seven representative frontier ML engineering case cards</title><desc id="desc">Seven cards for capability, evaluation, regression, data, efficiency, safety, and internal behavior feed one central evidence loop. Each card names a distinct evidence object.</desc><rect width="1200" height="620" fill="#F7F5EF"/><text x="55" y="50" font-family="Aptos, sans-serif" font-size="34" font-weight="700" fill="#18333D">Different case files, same evidence discipline</text><g font-family="Aptos, sans-serif" text-anchor="middle"><g fill="#FFF" stroke="#315F70" stroke-width="3"><rect x="40" y="100" width="250" height="110" rx="8"/><rect x="330" y="100" width="250" height="110" rx="8"/><rect x="620" y="100" width="250" height="110" rx="8"/><rect x="910" y="100" width="250" height="110" rx="8"/><rect x="185" y="400" width="250" height="110" rx="8"/><rect x="475" y="400" width="250" height="110" rx="8"/><rect x="765" y="400" width="250" height="110" rx="8"/></g><g font-size="23" font-weight="700" fill="#18333D"><text x="165" y="140">Capability</text><text x="455" y="140">Evaluation</text><text x="745" y="140">Regression</text><text x="1035" y="140">Data</text><text x="310" y="440">Efficiency</text><text x="600" y="440">Safety</text><text x="890" y="440">Internal behavior</text></g><g font-size="18" fill="#495A61"><text x="165" y="177">held-out tasks + slices</text><text x="455" y="177">grader audit + humans</text><text x="745" y="177">version x slice report</text><text x="1035" y="177">provenance + composition</text><text x="310" y="477">latency / throughput / memory</text><text x="600" y="477">rare high-cost categories</text><text x="890" y="477">probe + intervention</text></g><ellipse cx="600" cy="305" rx="255" ry="70" fill="#18333D"/><text x="600" y="282" font-size="24" font-weight="700" fill="#FFF">define better -> predict -> compare</text><text x="600" y="318" font-size="24" font-weight="700" fill="#FFF">inspect regressions -> state limit</text><text x="600" y="350" font-size="20" fill="#DDE9EC">choose the next discriminating experiment</text><g stroke="#687A80" stroke-width="3"><line x1="165" y1="210" x2="410" y2="270"/><line x1="455" y1="210" x2="500" y2="245"/><line x1="745" y1="210" x2="700" y2="245"/><line x1="1035" y1="210" x2="790" y2="270"/><line x1="310" y1="400" x2="430" y2="350"/><line x1="600" y1="400" x2="600" y2="375"/><line x1="890" y1="400" x2="770" y2="350"/></g></g><text x="55" y="580" font-family="Aptos, sans-serif" font-size="21" fill="#7B5311">Representative public categories, not a complete role map or private workflow claim.</text></svg>