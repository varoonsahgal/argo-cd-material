<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Quality and resource Pareto chart</title><desc id="desc">A scatterplot compares models P, Q, R, and S by macro-F1 and batch-1 latency. P dominates S; Q offers higher throughput; R is smallest. Scenario cards show that interactive, batch, and edge constraints select different points.</desc><rect width="1200" height="620" fill="#F7F5EF"/><text x="55" y="55" font-family="Aptos, sans-serif" font-size="34" font-weight="700" fill="#18333D">There is no winner without a constraint</text><g transform="translate(85 105)" font-family="Aptos, sans-serif"><rect width="650" height="420" fill="#FFF" stroke="#B8C4C7"/><line x1="75" y1="350" x2="610" y2="350" stroke="#687A80" stroke-width="3"/><line x1="75" y1="45" x2="75" y2="350" stroke="#687A80" stroke-width="3"/><text x="280" y="395" font-size="21" fill="#18333D">batch-1 latency (lower is left)</text><text x="-260" y="25" transform="rotate(-90)" font-size="21" fill="#18333D">macro-F1 (higher is up)</text><path d="M150 210 C240 150 360 115 540 95" fill="none" stroke="#B27A19" stroke-width="4" stroke-dasharray="10 8"/><circle cx="250" cy="115" r="28" fill="#315F70"/><text x="250" y="123" text-anchor="middle" font-size="24" font-weight="700" fill="#FFF">P</text><circle cx="510" cy="95" r="36" fill="#4C8662"/><text x="510" y="103" text-anchor="middle" font-size="24" font-weight="700" fill="#FFF">Q</text><circle cx="145" cy="225" r="20" fill="#B27A19"/><text x="145" y="233" text-anchor="middle" font-size="22" font-weight="700" fill="#FFF">R</text><circle cx="420" cy="155" r="31" fill="#B33A3A"/><text x="420" y="163" text-anchor="middle" font-size="24" font-weight="700" fill="#FFF">S</text><line x1="280" y1="130" x2="390" y2="150" stroke="#B33A3A" stroke-width="4"/><text x="330" y="112" font-size="18" fill="#972F2F">P dominates S</text></g><g font-family="Aptos, sans-serif"><rect x="790" y="115" width="350" height="110" rx="8" fill="#DDE9EC"/><text x="815" y="150" font-size="24" font-weight="700" fill="#18333D">Interactive</text><text x="815" y="185" font-size="20" fill="#18333D">latency &lt; 6 ms -> P</text><rect x="790" y="250" width="350" height="110" rx="8" fill="#E5F0E8"/><text x="815" y="285" font-size="24" font-weight="700" fill="#18333D">Nightly batch</text><text x="815" y="320" font-size="20" fill="#18333D">highest throughput -> Q</text><rect x="790" y="385" width="350" height="110" rx="8" fill="#FFF4D9"/><text x="815" y="420" font-size="24" font-weight="700" fill="#18333D">Edge device</text><text x="815" y="455" font-size="20" fill="#18333D">size &lt; 2 MB -> R</text><text x="70" y="580" font-size="21" fill="#7B5311">Circle size encodes model size. Hardware, load, tail latency, reliability, and energy remain unmeasured.</text></g></svg>