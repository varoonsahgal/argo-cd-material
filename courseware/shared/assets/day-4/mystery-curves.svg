<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Four mystery learning-curve cards</title><desc id="desc">Aligned small multiples show healthy training, underfitting, overfitting, and unstable optimization without diagnosis labels. Solid lines are training and dashed lines are validation.</desc><rect width="1200" height="620" fill="#F7F5EF"/><text x="55" y="52" font-family="Aptos, sans-serif" font-size="34" font-weight="700" fill="#18333D">What story fits each path?</text><g font-family="Aptos, sans-serif" fill="none" stroke-width="5"><g transform="translate(60 95)"><rect width="500" height="205" fill="#FFF" stroke="#B8C4C7"/><text x="18" y="34" fill="#18333D" font-size="28" font-weight="700">A</text><line x1="55" y1="170" x2="465" y2="170" stroke="#687A80" stroke-width="2"/><line x1="55" y1="55" x2="55" y2="170" stroke="#687A80" stroke-width="2"/><path d="M60 75 C150 115 245 140 460 153" stroke="#315F70"/><path d="M60 82 C150 119 245 137 460 145" stroke="#B33A3A" stroke-dasharray="12 8"/></g><g transform="translate(640 95)"><rect width="500" height="205" fill="#FFF" stroke="#B8C4C7"/><text x="18" y="34" fill="#18333D" font-size="28" font-weight="700">B</text><line x1="55" y1="170" x2="465" y2="170" stroke="#687A80" stroke-width="2"/><line x1="55" y1="55" x2="55" y2="170" stroke="#687A80" stroke-width="2"/><path d="M60 70 C130 90 220 102 460 108" stroke="#315F70"/><path d="M60 78 C140 96 225 108 460 114" stroke="#B33A3A" stroke-dasharray="12 8"/></g><g transform="translate(60 350)"><rect width="500" height="205" fill="#FFF" stroke="#B8C4C7"/><text x="18" y="34" fill="#18333D" font-size="28" font-weight="700">C</text><line x1="55" y1="170" x2="465" y2="170" stroke="#687A80" stroke-width="2"/><line x1="55" y1="55" x2="55" y2="170" stroke="#687A80" stroke-width="2"/><path d="M60 70 C150 105 250 140 460 158" stroke="#315F70"/><path d="M60 78 C145 117 230 135 300 130 C370 122 415 105 460 85" stroke="#B33A3A" stroke-dasharray="12 8"/></g><g transform="translate(640 350)"><rect width="500" height="205" fill="#FFF" stroke="#B8C4C7"/><text x="18" y="34" fill="#18333D" font-size="28" font-weight="700">D</text><line x1="55" y1="170" x2="465" y2="170" stroke="#687A80" stroke-width="2"/><line x1="55" y1="55" x2="55" y2="170" stroke="#687A80" stroke-width="2"/><path d="M60 95 L105 145 L150 70 L195 150 L240 78 L285 142 L330 68 L375 150 L420 80 L460 135" stroke="#315F70"/><path d="M60 110 L105 75 L150 145 L195 82 L240 150 L285 86 L330 138 L375 72 L420 145 L460 90" stroke="#B33A3A" stroke-dasharray="12 8"/></g></g><g font-family="Aptos, sans-serif" font-size="20"><line x1="865" y1="45" x2="920" y2="45" stroke="#315F70" stroke-width="5"/><text x="930" y="52" fill="#18333D">train</text><line x1="1010" y1="45" x2="1065" y2="45" stroke="#B33A3A" stroke-width="5" stroke-dasharray="12 8"/><text x="1075" y="52" fill="#18333D">validation</text><text x="55" y="600" fill="#7B5311">Aligned axes. Curves support hypotheses; they do not uniquely prove causes.</text></g></svg>