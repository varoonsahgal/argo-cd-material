<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Capstone evidence board and gates</title><desc id="desc">Four lanes separate facts, hypotheses, experiment record, and interpretation. Five locked gates control validity, diagnosis, primary run, interpretation before test, and one authorized test access.</desc><rect width="1200" height="620" fill="#F7F5EF"/><text x="55" y="52" font-family="Aptos, sans-serif" font-size="34" font-weight="700" fill="#18333D">Evidence board: never let facts and guesses merge</text><g font-family="Aptos, sans-serif"><g transform="translate(45 90)"><rect width="260" height="370" rx="8" fill="#DDE9EC" stroke="#315F70" stroke-width="3"/><text x="20" y="42" font-size="26" font-weight="700" fill="#18333D">1 | Facts</text><text x="20" y="85" font-size="19" fill="#18333D">split/hash</text><text x="20" y="120" font-size="19" fill="#18333D">baseline curves</text><text x="20" y="155" font-size="19" fill="#18333D">metrics + slices</text><text x="20" y="190" font-size="19" fill="#18333D">errors + resources</text></g><g transform="translate(325 90)"><rect width="260" height="370" rx="8" fill="#FFF4D9" stroke="#B27A19" stroke-width="3"/><text x="20" y="42" font-size="26" font-weight="700" fill="#18333D">2 | Hypotheses</text><text x="20" y="85" font-size="19" fill="#18333D">ranked limitation</text><text x="20" y="120" font-size="19" fill="#18333D">supporting evidence</text><text x="20" y="155" font-size="19" fill="#18333D">alternative</text><text x="20" y="190" font-size="19" fill="#18333D">disconfirmation</text></g><g transform="translate(605 90)"><rect width="260" height="370" rx="8" fill="#E5F0E8" stroke="#4C8662" stroke-width="3"/><text x="20" y="42" font-size="26" font-weight="700" fill="#18333D">3 | Experiment</text><text x="20" y="85" font-size="19" fill="#18333D">one major change</text><text x="20" y="120" font-size="19" fill="#18333D">expected + reject</text><text x="20" y="155" font-size="19" fill="#18333D">kept fixed</text><text x="20" y="190" font-size="19" fill="#18333D">record + stop rule</text></g><g transform="translate(885 90)"><rect width="270" height="370" rx="8" fill="#F3E5E7" stroke="#8A5360" stroke-width="3"/><text x="20" y="42" font-size="26" font-weight="700" fill="#18333D">4 | Interpret</text><text x="20" y="85" font-size="19" fill="#18333D">observed result</text><text x="20" y="120" font-size="19" fill="#18333D">accept/reject/narrow</text><text x="20" y="155" font-size="19" fill="#18333D">claim boundary</text><text x="20" y="190" font-size="19" fill="#18333D">next experiment</text></g><g text-anchor="middle" font-size="18" font-weight="700"><rect x="70" y="500" width="190" height="62" rx="8" fill="#18333D"/><text x="165" y="528" fill="#FFF">Gate 1</text><text x="165" y="550" fill="#FFF">valid baseline</text><rect x="285" y="500" width="190" height="62" rx="8" fill="#18333D"/><text x="380" y="528" fill="#FFF">Gate 2</text><text x="380" y="550" fill="#FFF">diagnosis commit</text><rect x="500" y="500" width="190" height="62" rx="8" fill="#18333D"/><text x="595" y="528" fill="#FFF">Gate 3</text><text x="595" y="550" fill="#FFF">authorize run</text><rect x="715" y="500" width="190" height="62" rx="8" fill="#18333D"/><text x="810" y="528" fill="#FFF">Gate 4</text><text x="810" y="550" fill="#FFF">lock decision</text><rect x="930" y="500" width="190" height="62" rx="8" fill="#B33A3A"/><text x="1025" y="528" fill="#FFF">Gate 5</text><text x="1025" y="550" fill="#FFF">one test access</text></g></g><text x="55" y="600" font-family="Aptos, sans-serif" font-size="20" fill="#7B5311">Case letters A/B/C reveal no diagnosis. Cached output must remain visibly labeled.</text></svg>