<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Controlled experiment evidence chain</title><desc id="desc">A strong chain links baseline evidence, falsifiable hypothesis, one major change, predicted and rejection evidence, observed result, interpretation, and next experiment. A crossed-out branch shows three simultaneous changes destroying attribution.</desc><rect width="1200" height="620" fill="#F7F5EF"/><text x="55" y="55" font-family="Aptos, sans-serif" font-size="34" font-weight="700" fill="#18333D">One run should answer one clear question</text><g font-family="Aptos, sans-serif" text-anchor="middle"><g fill="#FFF" stroke="#315F70" stroke-width="3"><rect x="50" y="110" width="170" height="90" rx="8"/><rect x="245" y="110" width="170" height="90" rx="8"/><rect x="440" y="110" width="170" height="90" rx="8"/><rect x="635" y="110" width="170" height="90" rx="8"/><rect x="830" y="110" width="170" height="90" rx="8"/><rect x="1025" y="110" width="130" height="90" rx="8"/></g><g font-size="21" fill="#18333D"><text x="135" y="145">baseline</text><text x="135" y="174">evidence</text><text x="330" y="145">falsifiable</text><text x="330" y="174">hypothesis</text><text x="525" y="145">one major</text><text x="525" y="174">change</text><text x="720" y="137">expected +</text><text x="720" y="164">rejecting</text><text x="720" y="188">evidence</text><text x="915" y="145">observed</text><text x="915" y="174">result</text><text x="1090" y="145">interpret</text><text x="1090" y="174">+ next</text></g><g stroke="#315F70" stroke-width="4" fill="#315F70"><line x1="220" y1="155" x2="240" y2="155"/><line x1="415" y1="155" x2="435" y2="155"/><line x1="610" y1="155" x2="630" y2="155"/><line x1="805" y1="155" x2="825" y2="155"/><line x1="1000" y1="155" x2="1020" y2="155"/></g><rect x="70" y="265" width="1060" height="95" rx="8" fill="#D8E8DD" stroke="#4C8662" stroke-width="3"/><text x="600" y="305" font-size="25" font-weight="700" fill="#285C3B">A clean negative result can strengthen the decision trail</text><text x="600" y="338" font-size="21" fill="#285C3B">It rejects or narrows a mechanism while controls remain fixed.</text><rect x="180" y="415" width="840" height="120" rx="8" fill="#FBE4E1" stroke="#B33A3A" stroke-width="3"/><text x="600" y="450" font-size="25" font-weight="700" fill="#972F2F">Confounded run</text><text x="600" y="487" font-size="22" fill="#972F2F">wider model + new optimizer + longer training</text><text x="600" y="518" font-size="20" fill="#972F2F">A score change cannot identify which factor or interaction caused it.</text><line x1="210" y1="425" x2="990" y2="525" stroke="#B33A3A" stroke-width="8"/><line x1="990" y1="425" x2="210" y2="525" stroke="#B33A3A" stroke-width="8"/></g><text x="55" y="590" font-family="Aptos, sans-serif" font-size="21" fill="#7B5311">Write the rejection observation and stop rule before compute.</text></svg>